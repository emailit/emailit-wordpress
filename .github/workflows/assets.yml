# Updates the WordPress.org listing (readme.txt and .wordpress-org/ banners,
# icons and screenshots) without a release, when they change on main.
name: Update WordPress.org listing

on:
  push:
    branches: [main]
    paths:
      - readme.txt
      - .wordpress-org/**

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the slug
        id: meta
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          echo "SLUG=$(grep -l '^ \* Plugin Name:' *.php | head -1 | sed 's/\.php$//')" >> "$GITHUB_ENV"
          if [ -n "$SVN_USERNAME" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Update the listing
        if: steps.meta.outputs.ready == 'true'
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.SLUG }}
          IGNORE_OTHER_FILES: true
